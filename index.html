<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>साइन इन (Sign In)</title>
    <!-- यहाँ आपकी CSS स्टाइल होगी -->
</head>
<body>

<div class="card">
    <h2>साइन इन (Sign In)</h2>
    <form id="signInForm">
        <div class="form-group">
            <label for="email">ईमेल आईडी (Email)</label>
            <input type="email" id="email" required placeholder="example@mail.com">
        </div>
        <div class="form-group">
            <label for="password">पासवर्ड (Password)</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn">साइन इन करें</button>
    </form>

    <div class="nav-links">
        <a href="signup.html">नया खाता बनाएँ (Sign Up)</a>
        <a href="reset.html">पासवर्ड भूल गए?</a>
    </div>
</div>

<!-- 🔴 जावास्क्रिप्ट कोड यहाँ लगेगा (</body> से ठीक पहले) 🔴 -->

   <script src="script.js"></script>
</body></script>

</body>
</html>
